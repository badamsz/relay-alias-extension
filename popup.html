<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Relay Aliases</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="20" height="20" />
      <span>Relay Aliases</span>
    </div>
    <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
  </header>

  <main id="app">
    <!-- Setup screen (no API key yet) -->
    <section id="setupView" class="view hidden">
      <p class="muted">
        Add your Firefox Relay API key to view and create masks from this popup.
      </p>
      <ol class="steps">
        <li>Sign in at relay.firefox.com</li>
        <li>Open your profile icon → Settings</li>
        <li>Copy the API key shown there</li>
      </ol>
      <button id="openOptionsBtn" class="primary-btn">Add API key</button>
    </section>

    <!-- Main screen -->
    <section id="mainView" class="view hidden">
      <div class="site-row">
        <span id="siteHost" class="site-host"></span>
      </div>
      <button id="newAliasBtn" class="primary-btn">
        <span id="newAliasLabel">+ New mask for this site</span>
      </button>
      <label class="checkbox-row">
        <input type="checkbox" id="blockPromoCheckbox" />
        Block promotional emails on new masks
      </label>

      <div id="quotaLine" class="muted small hidden"></div>

      <input
        id="searchInput"
        type="text"
        placeholder="Search your masks…"
        class="search-input"
      />

      <div id="listStatus" class="muted small"></div>
      <ul id="aliasList" class="alias-list"></ul>
    </section>

    <section id="errorView" class="view hidden">
      <p id="errorText" class="muted"></p>
      <button id="retryBtn" class="primary-btn">Try again</button>
    </section>
  </main>

  <footer class="footer">
    <a href="https://relay.firefox.com/accounts/profile/" target="_blank" rel="noopener">
      Manage all masks ↗
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
